[package]
name = "lorca"
description = "Lorca CLI: keys, local websocket, agent loop, relay sync"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "lorca"
path = "src/lib.rs"

[[bin]]
name = "lorca"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# The command-line binary: everything.
cli = ["runner", "server", "dep:usage", "dep:tracing-subscriber"]
# Connecting and disconnecting account providers. Devices use this without the agent loop.
provider-auth = ["dep:lorca-provider-auth"]
# Running bots: the agent loop, providers, tools. Off for a Device that only takes part.
runner = ["provider-auth", "dep:lorca-agent", "dep:open", "dep:rmcp", "dep:mcp_http"]
# The local websocket the desktop app connects to.
server = ["dep:axum"]

[dependencies]
lorca-agent = { path = "../agent", optional = true }
lorca-provider-auth = { path = "../provider-auth", optional = true }
anyhow.workspace = true
async-trait.workspace = true
axum = { workspace = true, optional = true }
base64.workspace = true
chacha20poly1305.workspace = true
usage = { package = "usage-rs", version = "6", optional = true }
crypto_box.workspace = true
data-encoding.workspace = true
dirs.workspace = true
ed25519-dalek.workspace = true
futures.workspace = true
hkdf.workspace = true
libc.workspace = true
open = { workspace = true, optional = true }
rand.workspace = true
regex.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tokio-tungstenite.workspace = true
rustls.workspace = true
webpki-roots.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, optional = true }
uuid.workspace = true
x25519-dalek.workspace = true
if-addrs = "0.15.0"
# rmcp speaks reqwest 0.13; the rest of the crate is on the workspace's 0.12, so the MCP side has its own client.
mcp_http = { package = "reqwest", version = "0.13", default-features = false, features = ["json", "stream", "rustls", "http2"], optional = true }
rmcp = { version = "3.4.0", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "auth", "reqwest"], optional = true }
