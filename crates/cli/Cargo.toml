[package]
name = "lorca"
description = "Lorca CLI: keys, local websocket, agent loop, relay sync"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "lorca"
path = "src/lib.rs"

[[bin]]
name = "lorca"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# The command-line binary: everything.
cli = ["runner", "server", "dep:usage", "dep:tracing-subscriber", "dep:flate2", "dep:tar", "dep:zip"]
# Connecting and disconnecting account providers. Devices use this without the agent loop.
provider-auth = ["dep:lorca-provider-auth"]
# Running bots: the agent loop, providers, tools. Off for a Device that only takes part.
runner = ["provider-auth", "dep:lorca-agent", "dep:open", "dep:rmcp", "dep:mcp_http", "dep:process-wrap", "dep:sse-stream", "dep:httpdate"]
# The local websocket the desktop app connects to.
server = ["dep:axum", "dep:subtle"]

[dependencies]
lorca-agent = { path = "../agent", optional = true }
lorca-models = { path = "../models" }
lorca-provider-auth = { path = "../provider-auth", optional = true }
lorca-tls = { path = "../tls" }
anyhow.workspace = true
async-trait.workspace = true
axum = { workspace = true, optional = true }
base64.workspace = true
chacha20poly1305.workspace = true
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
iana-time-zone = "0.1"
usage = { package = "usage-rs", version = "6", optional = true }
crypto_box.workspace = true
data-encoding.workspace = true
dirs.workspace = true
ed25519-dalek.workspace = true
futures.workspace = true
hkdf.workspace = true
libc.workspace = true
open = { workspace = true, optional = true }
# A reply's quote of a message reads as plain text.
pulldown-cmark = { version = "0.13", default-features = false }
rand.workspace = true
regex.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# The local websocket compares its token in constant time.
subtle = { version = "2.6", optional = true }
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tokio-tungstenite.workspace = true
rustls.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, optional = true }
uuid.workspace = true
x25519-dalek.workspace = true
if-addrs = "0.15.0"
# The release archives `lorca update` unpacks: .tar.gz for macOS and Linux.
flate2 = { version = "1", optional = true }
tar = { version = "0.4", default-features = false, optional = true }
# rmcp speaks reqwest 0.13; the rest of the crate is on the workspace's 0.12, so the MCP side has its own client.
mcp_http = { package = "reqwest", version = "0.13", default-features = false, features = ["json", "stream", "rustls", "http2", "system-proxy"], optional = true }
rmcp = { version = "3.4.0", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "auth", "reqwest"], optional = true }
# rmcp's process wrapper, to start a stdio server in a process group (a job object on Windows) that stops as one.
process-wrap = { version = "10", features = ["tokio1"], optional = true }
sse-stream = { version = "0.2.4", optional = true }
httpdate = { version = "1", optional = true }

[target.'cfg(windows)'.dependencies]
# `serve --parent-pid` watches the parent through a process handle; `lorca service run` leaves
# the console a sign-in opened.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Console"] }
# The Windows release archive `lorca update` unpacks.
zip = { version = "2", default-features = false, features = ["deflate"], optional = true }

[dev-dependencies]
# Real images for the attachment tests; the agent crate builds the same crate already.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
