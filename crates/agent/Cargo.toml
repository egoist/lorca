[package]
name = "lorca-agent"
description = "Agent loop, tools, and provider adapters for Lorca (after pi-agent-core)"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["codemode"]
# The codemode tool: model-written JavaScript in a QuickJS VM that calls other tools.
codemode = ["dep:rquickjs"]

[dependencies]
lorca-models = { path = "../models" }
lorca-provider-auth = { path = "../provider-auth" }
lorca-tls = { path = "../tls" }
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
futures.workspace = true
globset.workspace = true
ignore.workspace = true
libc.workspace = true
regex.workspace = true
rand.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true
jsonschema = { version = "0.56", default-features = false }
# Images as models take them: decoded, turned upright, scaled down, and written again (`images`).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico"] }
rquickjs = { version = "0.14", optional = true }
# `bash` on pipes: the shell and what it starts stop as one, a process group on Unix and a job
# object on Windows.
process-wrap = { version = "10", features = ["tokio1"] }

[target.'cfg(windows)'.dependencies]
# `bash` sessions on Windows: pseudo consoles, jobs, and processes (`tools::conpty`).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Pipes", "Win32_System_Threading"] }
