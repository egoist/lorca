# Runs the unit tests of the crates that ship on Windows (the CLI, the agent, provider sign-in) on
# a Windows runner, where paths have drive letters, PATH splits on `;`, and commands run on pipes
# in Git for Windows' bash, which the runner has. Tests of Unix-only behavior (terminal sessions,
# the login shell's environment) are `#[cfg(unix)]`. The release builds x86_64-pc-windows-gnu with
# zig; the tests build with the runner's MSVC toolchain, which runs the same code.
name: Windows

on:
  push:
    branches: [main]
    paths: ["crates/agent/**", "crates/cli/**", "crates/provider-auth/**", "Cargo.toml", "Cargo.lock", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["crates/agent/**", "crates/cli/**", "crates/provider-auth/**", "Cargo.toml", "Cargo.lock", ".github/workflows/windows.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p lorca -p lorca-agent -p lorca-provider-auth
