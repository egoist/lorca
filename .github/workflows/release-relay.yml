# A relay-vX.Y.Z tag publishes the relay image to GHCR for Linux amd64 and arm64.
# The version and full commit SHA identify a build; latest follows the last published tag.
name: Release relay

on:
  push:
    tags: ["relay-v*"]

permissions:
  contents: read

# Serialize publications so two builds do not update latest at the same time.
concurrency:
  group: release-relay

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Name the image and validate the release tag
        id: release
        shell: bash
        run: |
          if [[ ! $GITHUB_REF_NAME =~ ^relay-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Expected a relay-vX.Y.Z tag"
            exit 1
          fi
          echo "version=${GITHUB_REF_NAME#relay-v}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-relay" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ steps.release.outputs.image }}
          tags: |
            type=raw,value=${{ steps.release.outputs.version }}
            type=raw,value=latest
            type=sha,format=long
      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          file: crates/relay/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=relay
          cache-to: type=gha,mode=max,scope=relay
