# A relay-vX.Y.Z tag publishes the relay image to GHCR and asks Dokploy to deploy it.
# The version and full commit SHA identify a build; latest follows the last published tag.
name: Release relay

on:
  push:
    tags: ["relay-v*"]

permissions:
  contents: read

# Serialize publications so two builds do not update latest at the same time.
concurrency:
  group: release-relay

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.release.outputs.image }}
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
    steps:
      - name: Name the image and validate the release tag
        id: release
        shell: bash
        run: |
          if [[ ! $GITHUB_REF_NAME =~ ^relay-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Expected a relay-vX.Y.Z tag"
            exit 1
          fi
          echo "version=${GITHUB_REF_NAME#relay-v}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-relay" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ steps.release.outputs.image }}
          tags: |
            type=raw,value=${{ steps.release.outputs.version }}
            type=raw,value=latest
            type=sha,format=long

  build:
    needs: prepare
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: crates/relay/Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ needs.prepare.outputs.labels }}
          cache-from: type=gha,scope=relay-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=relay-${{ matrix.arch }}
      - name: Export image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: relay-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: relay-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-platform image tags
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          TAGS: ${{ needs.prepare.outputs.tags }}
        shell: bash
        working-directory: ${{ runner.temp }}/digests
        run: |
          args=()
          while IFS= read -r tag; do
            [[ -n $tag ]] && args+=(--tag "$tag")
          done <<< "$TAGS"
          digests=()
          for digest in *; do
            digests+=("$IMAGE@sha256:$digest")
          done
          [[ ${#digests[@]} -eq 2 ]]
          docker buildx imagetools create "${args[@]}" "${digests[@]}"

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Deploy the published image in Dokploy
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APPLICATION_ID: ${{ secrets.DOKPLOY_APPLICATION_ID }}
        shell: bash
        run: |
          for name in DOKPLOY_URL DOKPLOY_API_KEY DOKPLOY_APPLICATION_ID; do
            if [[ -z ${!name} ]]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
          jq -n --arg id "$DOKPLOY_APPLICATION_ID" '{applicationId: $id}' > "$RUNNER_TEMP/deploy.json"
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 60 \
            --request POST "${DOKPLOY_URL%/}/api/application.deploy" \
            --header "x-api-key: $DOKPLOY_API_KEY" \
            --header "Content-Type: application/json" \
            --data-binary @"$RUNNER_TEMP/deploy.json"
          echo "Dokploy accepted the deployment request; check its deployment logs for rollout status." >> "$GITHUB_STEP_SUMMARY"
