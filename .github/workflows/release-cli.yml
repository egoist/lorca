# Releases the lorca CLI for computers without the app. A tag cli-vX.Y.Z, or a run by hand, builds
# the version in Cargo.toml for macOS, Linux, and Windows, installs the builds with the site's
# install scripts on each system, and drafts the release cli-vX.Y.Z with the archives. Once the
# draft is published, install-cli.sh and install-cli.ps1 download from it. A release that is
# already published is left alone. docs/releasing-cli.md has the steps.
name: Release CLI

on:
  push:
    tags: ["cli-v*"]
  workflow_dispatch:

permissions:
  contents: read

# One run at a time, so two runs never draft the same release twice.
concurrency:
  group: release-cli

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.crate.outputs.version }}
      tag: ${{ steps.crate.outputs.tag }}
      published: ${{ steps.release.outputs.published }}
    steps:
      - uses: actions/checkout@v7
      - id: crate
        name: Name the release after the crate version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "lorca") | .version')
          tag=cli-v$version
          # A pushed tag names the release, and `lorca --version` has to say the same.
          if [[ $GITHUB_REF_TYPE == tag && $GITHUB_REF_NAME != "$tag" ]]; then
            echo "::error::$GITHUB_REF_NAME does not match lorca $version: set version in [workspace.package] of Cargo.toml to ${GITHUB_REF_NAME#cli-v} and tag that commit"
            exit 1
          fi
          # A release takes the tag that exists, so the builds have to come from its commit.
          tagged=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha 2>/dev/null || true)
          if [[ -n $tagged && $tagged != "$GITHUB_SHA" ]]; then
            echo "::error::$tag already tags $tagged: run this on that commit, or bump the version in Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - id: release
        name: Look for the published release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.crate.outputs.tag }}
        run: |
          # This job's token cannot see drafts; the publish job looks for one.
          if [[ $(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null) == false ]]; then
            echo "::notice::$TAG is already published, so there is nothing to build"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build ${{ matrix.name }}
    needs: version
    if: needs.version.outputs.published != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Xcode builds for the Mac; zig, through cargo-zigbuild, for the others. The Linux builds
          # are static (musl), so one runs on any distribution, and Windows 11 on Arm runs the
          # x86_64 build.
          - { name: macos-aarch64, target: aarch64-apple-darwin, os: macos-latest }
          - { name: linux-aarch64, target: aarch64-unknown-linux-musl, os: ubuntu-latest, zig: true }
          - { name: linux-x86_64, target: x86_64-unknown-linux-musl, os: ubuntu-latest, zig: true }
          - { name: windows-x86_64, target: x86_64-pc-windows-gnu, os: ubuntu-latest, zig: true }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - if: matrix.zig
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - name: Build
        run: cargo ${{ matrix.zig && 'zigbuild' || 'build' }} --release --locked -p lorca --target ${{ matrix.target }}
      - name: Pack
        env:
          TARGET: ${{ matrix.target }}
          NAME: ${{ matrix.name }}
        run: |
          mkdir dist
          bin=target/$TARGET/release
          # The binary alone at the archive's root, and its checksum beside the archive.
          if [[ $TARGET == *windows* ]]; then
            archive=lorca-cli-$NAME.zip
            zip -jX "dist/$archive" "$bin/lorca.exe"
          else
            archive=lorca-cli-$NAME.tar.gz
            # bsdtar on the Mac adds AppleDouble files and xattr headers, which GNU tar warns about.
            flags=(--format ustar)
            if [[ $RUNNER_OS == macOS ]]; then flags+=(--no-mac-metadata); fi
            tar "${flags[@]}" -czf "dist/$archive" -C "$bin" lorca
          fi
          cd dist && shasum -a 256 "$archive" > "$archive.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: lorca-cli-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  test:
    name: install on ${{ matrix.os }}
    needs: [version, build]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # The builds, served where a release serves them: <releases>/latest/download/<file>.
      LORCA_DOWNLOAD_URL: http://127.0.0.1:8000
      WANT: lorca ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: site/latest/download
          merge-multiple: true
      - name: Install with install-cli.sh, twice
        if: runner.os != 'Windows'
        run: |
          python3 -m http.server --bind 127.0.0.1 --directory site 8000 &
          for _ in $(seq 50); do curl -fs -o /dev/null "$LORCA_DOWNLOAD_URL/" && break; sleep 0.2; done
          sh web/public/install-cli.sh
          # The second run is an update over the first.
          sh web/public/install-cli.sh
          version=$(~/.local/bin/lorca --version)
          if [[ "$version" != "$WANT" ]]; then echo "::error::lorca --version says $version"; exit 1; fi
      - name: Install with install-cli.ps1 in Windows PowerShell, then again in PowerShell 7
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Start-Process python -ArgumentList '-m', 'http.server', '--bind', '127.0.0.1', '--directory', 'site', '8000' -WindowStyle Hidden
          foreach ($try in 1..50) {
            try { Invoke-WebRequest "$env:LORCA_DOWNLOAD_URL/" -UseBasicParsing | Out-Null; break } catch { Start-Sleep -Milliseconds 200 }
          }
          # The way people run it: the script's text through Invoke-Expression.
          powershell -NoProfile -Command 'Get-Content -Raw web/public/install-cli.ps1 | Invoke-Expression'
          if ($LASTEXITCODE -ne 0) { throw 'the install in Windows PowerShell failed' }
          Get-Content -Raw web/public/install-cli.ps1 | Invoke-Expression
          $version = lorca --version
          if ($version -ne $env:WANT) { throw "lorca --version says $version" }
          $userPath = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Environment').GetValue('Path')
          if ($userPath -notlike "*$HOME\.local\bin*") { throw "the user PATH lacks .local\bin: $userPath" }

  publish:
    needs: [version, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Draft ${{ needs.version.outputs.tag }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          state=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq 'if .isDraft then "draft" else "published" end' 2>/dev/null || echo none)
          case $state in
            published)
              echo "::notice::$TAG was published while this ran, so it stays as it is"
              ;;
            draft)
              # An earlier run's draft takes these builds, and keeps its title and notes.
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
              gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
              ;;
            none)
              cat > notes.md <<'EOF'
          Install or update:

          ```sh
          curl -fsSL https://lorca.app/install-cli.sh | sh    # macOS and Linux
          irm https://lorca.app/install-cli.ps1 | iex         # Windows, in PowerShell
          ```
          EOF
              gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" --title "Lorca CLI $VERSION" --notes-file notes.md
              ;;
          esac
