plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.lorca'
version = '0.1.0'

android {
  namespace "app.lorca.core"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // The UniFFI Kotlin bindings load liblorca_mobile.so through JNA.
  // JNA 5.17+ is required by Android devices and emulators with 16 KiB pages.
  implementation "net.java.dev.jna:jna:5.19.1@aar"
  // Pushes arrive as FCM data messages; PushService opens them and posts the notification.
  implementation "com.google.firebase:firebase-messaging:24.1.0"
  implementation "androidx.core:core-ktx:1.13.1"
}
