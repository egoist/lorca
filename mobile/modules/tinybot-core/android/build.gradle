plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'dev.tinybot'
version = '0.1.0'

android {
  namespace "dev.tinybot.core"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // The UniFFI Kotlin bindings load libtinybot_mobile.so through JNA.
  implementation "net.java.dev.jna:jna:5.15.0@aar"
}
